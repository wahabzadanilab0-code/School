<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>لندینگ پیج</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
        rel="stylesheet"
    >

</head>

<body>
 <style>
   


:root {
    --primary: #087df5;
    --text: #263746;
    --card-border: rgba(255, 255, 255, 0.86);
    --card-bg: rgba(214, 226, 235, 0.16);
    --input-bg: rgba(255, 255, 255, 0.96);
}


* {
    box-sizing: border-box;
}


html,
body {
    width: 100%;
    min-height: 100%;
    margin: 0;
}


body {
    font-family: "Vazirmatn", Tahoma, Arial, sans-serif;
    color: var(--text);
    background: #a8bdcf;
}


button,
input {
    font-family: inherit;
}


.landing-page {
    position: relative;
    min-height: 100vh;
    overflow: hidden;
    isolation: isolate;

    background:
        linear-gradient(
            180deg,
            rgba(172, 202, 226, 0.48) 0%,
            rgba(236, 231, 225, 0.30) 52%,
            rgba(99, 135, 163, 0.40) 100%
        ),

        url("mountain-bg.jpg")
        center center / cover no-repeat;
}


.background-overlay {
    position: absolute;
    inset: 0;
    z-index: -1;

    background:
        linear-gradient(
            90deg,
            rgba(232, 240, 246, 0.17),
            rgba(255, 255, 255, 0.05) 48%,
            rgba(54, 92, 125, 0.10)
        );

    pointer-events: none;
}


.topbar {
    position: absolute;
    top: 13px;
    left: 16px;
    z-index: 10;
}


.theme-toggle {
    display: flex;
    align-items: center;
    gap: 8px;

    padding: 0;

    border: 0;

    background: transparent;

    cursor: pointer;
}


.theme-icon {
    width: 27px;
    height: 27px;

    display: grid;
    place-items: center;

    color: #132334;

    font-size: 25px;
    line-height: 1;
}


.theme-icon.sun {
    font-size: 23px;
}


.switch-track {
    position: relative;

    width: 49px;
    height: 27px;

    display: block;

    border-radius: 999px;

    background: #f6f6f6;

    box-shadow:
        inset 0 0 0 1px rgba(45, 62, 76, 0.08),
        0 1px 3px rgba(28, 49, 66, 0.12);

    transition: background-color 0.25s ease;
}


.switch-thumb {
    position: absolute;

    top: 3px;
    right: 3px;

    width: 21px;
    height: 21px;

    border-radius: 50%;

    background: #bfc1c2;

    transition:
        transform 0.25s ease,
        background-color 0.25s ease;
}


.hero {
    min-height: 100vh;

    display: flex;

    align-items: flex-start;

    justify-content: center;

    padding:
        172px
        24px
        48px;

    text-align: center;
}


.hero-content {
    width: min(850px, 100%);
}


.hero-title {
    margin: 0;

    color: var(--text);

    font-size: clamp(30px, 3vw, 44px);

    line-height: 1.55;

    font-weight: 500;

    letter-spacing: -1.2px;
}


.hero-title span {
    color: var(--primary);

    font-weight: 600;
}


.hero-description {
    margin: 21px auto 0;

    max-width: 830px;

    color: #394b5b;

    font-size: clamp(13px, 1.25vw, 17px);

    line-height: 2;

    font-weight: 400;
}


.countdown {
    display: flex;

    direction: ltr;

    justify-content: center;

    align-items: stretch;

    gap: 24px;

    margin: 101px auto 0;
}


.countdown-item {
    width: 125px;

    min-height: 123px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 8px;

    border:
        2px solid
        var(--card-border);

    border-radius: 10px;

    background: var(--card-bg);

    backdrop-filter: blur(2px);

    -webkit-backdrop-filter: blur(2px);

    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.24),
        0 1px 1px rgba(255, 255, 255, 0.05);
}


.countdown-item strong {
    direction: ltr;

    color: #344351;

    font-size: 36px;

    line-height: 1;

    font-weight: 600;
}


.countdown-item span {
    color: #344351;

    font-size: 16px;

    line-height: 1.5;

    font-weight: 400;
}


.join-text {
    margin:
        69px auto
        25px;

    color: #334655;

    font-size: 16px;

    line-height: 1.9;
}


.join-form {
    direction: ltr;

    width: min(520px, 100%);

    height: 48px;

    margin: 0 auto;

    display: flex;

    align-items: stretch;

    overflow: hidden;

    border-radius: 5px;

    box-shadow:
        0 2px 9px
        rgba(35, 65, 90, 0.07);
}


.join-form .form-control {
    min-width: 0;

    height: 48px;

    border: 0;

    border-radius: 0;

    background: var(--input-bg);

    box-shadow: none !important;

    color: #344351;

    text-align: right;

    direction: rtl;
}


.join-form .form-control:focus {
    border: 0;

    outline: none;
}


.join-btn {
    flex: 0 0 92px;

    height: 48px;

    border: 0;

    border-radius: 0;

    background: var(--primary);

    color: #fff;

    font-size: 15px;

    font-weight: 500;

    transition:
        background-color 0.2s ease,
        transform 0.2s ease;
}


.join-btn:hover {
    background: #0872df;

    color: #fff;
}


.join-btn:active {
    transform: translateY(1px);
}


.form-message {
    min-height: 28px;

    padding-top: 9px;

    color: #126fbd;

    font-size: 13px;
}


.landing-page.dark {
    --text: #edf5fb;

    --card-border: rgba(255, 255, 255, 0.50);

    --card-bg: rgba(25, 47, 67, 0.28);

    --input-bg: rgba(255, 255, 255, 0.94);

    background:
        linear-gradient(
            180deg,
            rgba(20, 42, 62, 0.60) 0%,
            rgba(24, 45, 62, 0.36) 50%,
            rgba(8, 25, 42, 0.62) 100%
        ),

        url("mountain-bg.jpg")
        center center / cover no-repeat;
}


.landing-page.dark .background-overlay {
    background:
        rgba(7, 23, 38, 0.18);
}


.landing-page.dark .hero-description,
.landing-page.dark .join-text,
.landing-page.dark .countdown-item strong,
.landing-page.dark .countdown-item span {
    color: #edf5fb;
}


.landing-page.dark .switch-track {
    background: #263e53;
}


.landing-page.dark .switch-thumb {
    background: #d9e2e8;

    transform:
        translateX(-22px);
}


@media (max-width: 768px) {

    .hero {
        padding-top: 125px;
        padding-bottom: 40px;
    }


    .hero-title {
        font-size: 30px;
    }


    .hero-description {
        margin-top: 15px;

        font-size: 13px;

        line-height: 2.1;
    }


    .countdown {
        gap: 10px;

        margin-top: 58px;
    }


    .countdown-item {
        width: 86px;

        min-height: 92px;

        border-radius: 8px;
    }


    .countdown-item strong {
        font-size: 28px;
    }


    .countdown-item span {
        font-size: 13px;
    }


    .join-text {
        margin-top: 48px;

        font-size: 14px;
    }

}


@media (max-width: 480px) {

    .topbar {
        top: 10px;
        left: 10px;
    }


    .hero {
        padding:
            105px
            16px
            30px;
    }


    .hero-title {
        font-size: 25px;

        letter-spacing: -0.7px;
    }


    .hero-description {
        font-size: 12px;
    }


    .countdown {
        gap: 6px;

        margin-top: 45px;
    }


    .countdown-item {
        width: 70px;

        min-height: 82px;
    }


    .countdown-item strong {
        font-size: 23px;
    }


    .countdown-item span {
        font-size: 11px;
    }


    .join-text {
        margin-top: 42px;

        font-size: 12px;
    }


    .join-form {
        width: 100%;
    }


    .join-btn {
        flex-basis: 82px;
    }

}


* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Vazirmatn", sans-serif;
    background: #263d50;
}

.contact-section {
    width: 100%;
    min-height: 100vh;
    padding: 8px 40px;
    background:
        linear-gradient(
            rgba(45, 65, 82, 0.42),
            rgba(45, 65, 82, 0.42)
        ),
        url("mountain-bg.jpg") center center / cover no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
}

.contact-container {
    width: 100%;
    max-width: 1600px;
    display: grid;
    grid-template-columns: 1.55fr 1fr;
    gap: 30px;
    direction: ltr;
}

.contact-form-box,
.contact-info-box {
    direction: rtl;
    background: rgba(210, 220, 230, 0.58);
    border-top: 5px solid #087df5;
    min-height: 770px;
    padding: 35px 38px;
    backdrop-filter: blur(3px);
}

.contact-form {
    width: 100%;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
}

.form-group {
    width: 100%;
    margin-bottom: 22px;
}

.form-group label {
    display: block;
    margin-bottom: 10px;
    font-size: 20px;
    font-weight: 600;
    color: #111;
}

.form-group input,
.form-group textarea {
    width: 100%;
    border: none;
    outline: none;
    background: #fff;
    border-radius: 4px;
    font-family: inherit;
    font-size: 17px;
    color: #222;
    padding: 12px 14px;
    direction: rtl;
    transition: 0.2s;
}

.form-group input {
    height: 48px;
}

.form-group textarea {
    height: 315px;
    resize: vertical;
}

.form-group input:focus,
.form-group textarea:focus {
    box-shadow: 0 0 0 3px rgba(8, 125, 245, 0.2);
}

.full-width {
    width: 100%;
}

.send-button {
    display: block;
    margin: 36px auto 0;
    padding: 10px 22px;
    border: none;
    border-radius: 4px;
    background: #087df5;
    color: #fff;
    font-family: inherit;
    font-size: 19px;
    cursor: pointer;
    transition: 0.2s ease;
}

.send-button:hover {
    background: #0668ce;
    transform: translateY(-1px);
}

.contact-info-box {
    padding: 35px 38px 25px;
}

.contact-item {
    display: flex;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 26px;
}

.contact-icon {
    width: 58px;
    height: 58px;
    min-width: 58px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 28px;
}

.contact-text {
    flex: 1;
    text-align: right;
    padding-top: 2px;
}

.contact-text h3 {
    margin-bottom: 7px;
    font-size: 21px;
    font-weight: 600;
    color: #111;
}

.contact-text p {
    font-size: 18px;
    line-height: 1.8;
    color: #111;
}

.map-box {
    width: 100%;
    height: 405px;
    margin-top: 25px;
    overflow: hidden;
    background: #ddd;
}

.map-box iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
}

@media (max-width: 1000px) {
    .contact-section {
        padding: 20px;
    }

    .contact-container {
        grid-template-columns: 1fr;
    }

    .contact-form-box,
    .contact-info-box {
        min-height: auto;
    }
}

@media (max-width: 600px) {
    .contact-section {
        padding: 12px;
    }

    .contact-form-box,
    .contact-info-box {
        padding: 25px 20px;
    }

    .form-row {
        grid-template-columns: 1fr;
        gap: 0;
    }

    .form-group textarea {
        height: 220px;
    }

    .map-box {
        height: 300px;
    }

    .contact-text h3 {
        font-size: 18px;
    }

    .contact-text p {
        font-size: 16px;
    }
}
.map-box {
    width: 100%;
    height: 405px;
    margin-top: 25px;
    overflow: hidden;
    background: #ddd;
}

.map-box iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
}
 </style>
    <main class="landing-page">

        <div class="background-overlay"></div>

        <header class="topbar">

            <button
                id="themeToggle"
                class="theme-toggle"
                type="button"
            >

                <span class="theme-icon moon">
                    ☾
                </span>

                <span class="switch-track">
                    <span class="switch-thumb"></span>
                </span>

                <span class="theme-icon sun">
                    ☀
                </span>

            </button>

        </header>


        <section class="hero container-fluid">

            <div class="hero-content">

                <h1 class="hero-title">

                    <span>
         فورم آنلاین 
                    </span>

 ثبت نام مدرسه
                </h1>


                <p class="hero-description">

                  همین حالا میتوانین در این فورم خود را به مکتب آنلاین ثبت نام کنید 
                  و مهلت آن ذکر شده.

                <div
                    class="countdown"
                    id="countdown"
                    data-days="70"
                    data-hours="10"
                    data-minutes="14"
                    data-seconds="16"
                >

                    <div class="countdown-item">

                        <strong id="seconds">
                            16
                        </strong>

                        <span>
                            ثانیه
                        </span>

                    </div>


                    <div class="countdown-item">

                        <strong id="minutes">
                            14
                        </strong>

                        <span>
                            دقیقه
                        </span>

                    </div>


                    <div class="countdown-item">

                        <strong id="hours">
                            10
                        </strong>

                        <span>
                            ساعت
                        </span>

                    </div>


                    <div class="countdown-item">

                        <strong id="days">
                            70
                        </strong>

                        <span>
                            روز
                        </span>

                    </div>

                </div>


                <p class="join-text">

                  همین حالا عضو شوید.
                </p>


                <form
                    id="joinForm"
                    class="join-form"
                >

                    <input
                        id="emailInput"
                        class="form-control"
                        type="email"
                        required
                    >

                    <button
                        class="btn join-btn"
                        type="submit"
                    >

                        عضویت

                    </button>

                </form>


                <div
                    id="formMessage"
                    class="form-message"
                ></div>

            </div>

        </section>

    </main>


    <section class="contact-section" dir="rtl">
    <div class="contact-container">

        <div class="contact-form-box">
            <form class="contact-form">

                <div class="form-row">
                    <div class="form-group">
                        <label for="name">نام :</label>
                        <input type="text" id="name" name="name">
                    </div>

                    <div class="form-group">
                        <label for="email">ایمیل :</label>
                        <input type="email" id="email" name="email">
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="subject">موضوع :</label>
                    <input type="text" id="subject" name="subject">
                </div>

                <div class="form-group full-width">
                    <label for="message">متن پیام :</label>
                    <textarea id="message" name="message"></textarea>
                </div>

                <button type="submit" class="send-button">
                    ارسال پیام
                </button>

            </form>
        </div>

        <div class="contact-info-box">

            <div class="contact-item">
                <div class="contact-icon">
                    <span>⌾</span>
                </div>

                <div class="contact-text">
                    <h3>آدرس:</h3>
                    <p>هرات باغ آزادی سرک بوهنتون . آموزشگاه سایق</p>
                </div>
            </div>

            <div class="contact-item">
                <div class="contact-icon">
                    <span>✉</span>
                </div>

                <div class="contact-text">
                    <h3>ایمیل:</h3>
                    <p>sayeq@gmail.com</p>
                </div>
            </div>

            <div class="contact-item">
                <div class="contact-icon">
                    <span>▯</span>
                </div>

                <div class="contact-text">
                    <h3>شماره تماس:</h3>
                    <p>۰۷۹۲۳۵۷۸۶۷</p>
                </div>
            </div>

            <div class="map-box">
    <iframe
        src="https://www.google.com/maps?q=9665%2BGR9%2C%20Herat%2C%20Afghanistan&output=embed"
        width="100%"
        height="100%"
        style="border:0;"
        loading="lazy"
        allowfullscreen>
    </iframe>
</div>

        </div>

    </div>
</section>

</body>

</html>
